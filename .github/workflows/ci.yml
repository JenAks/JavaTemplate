name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: mvn dependency:resolve
        run: mvn dependency:resolve

      - name: seal cli
        uses: seal-community/cli-action@latest
        with:
          mode: fix
          fix_mode: remote
          token: ${{ secrets.SEAL_TOKEN }}
          project: javatemplate
          target: pom.xml

      - name: mvn install
        run: mvn install

      - name: mvn package
        run: mvn package

      - name: mvn verify
        run: mvn verify
